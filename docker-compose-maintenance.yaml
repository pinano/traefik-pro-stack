services:
  maintenance:
    image: nginx:1.31.9-alpine3.24-slim
    container_name: ${PROJECT_NAME:-stack}-maintenance
    restart: always
    volumes:
      - ./config/maintenance:/etc/nginx/maintenance:ro
      - ./config/maintenance/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik
    security_opt:
      - no-new-privileges=true
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 32M
    labels:
      - "traefik.enable=true"
      # Match all domains except the admin DOMAIN
      - "traefik.http.routers.maintenance.rule=PathPrefix(`/`) && !Host(`${DASHBOARD_SUBDOMAIN:-dashboard}.${DOMAIN}`)"
      # Extremely high priority to override all other dynamic and static routes
      - "traefik.http.routers.maintenance.priority=999999"
      - "traefik.http.routers.maintenance.entrypoints=websecure"
      - "traefik.http.routers.maintenance.tls=true"

      # Catch HTTP traffic too
      - "traefik.http.routers.maintenance-http.rule=PathPrefix(`/`) && !Host(`${DASHBOARD_SUBDOMAIN:-dashboard}.${DOMAIN}`)"
      - "traefik.http.routers.maintenance-http.priority=999999"
      - "traefik.http.routers.maintenance-http.entrypoints=web"

      # Route to Nginx port 80
      - "traefik.http.services.maintenance.loadbalancer.server.port=80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik:
    name: traefik
    external: true
