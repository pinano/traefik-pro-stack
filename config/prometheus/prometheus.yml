global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules.yml"

scrape_configs:
  - job_name: "prometheus"
    # Prometheus enforces Basic auth on ALL endpoints since --web.config.file
    # (audit M7). The token file is generated by 04-assets.sh.
    basic_auth:
      username: alloy
      password_file: /etc/prometheus/remote-write-token
    static_configs:
      - targets: ["localhost:9090"]

storage:
  tsdb:
    out_of_order_time_window: 30m
