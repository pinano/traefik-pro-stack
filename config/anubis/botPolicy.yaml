bots:
  - import: (data)/clients/docker-client.yaml
  - name: cloudflare-workers
    headers_regex:
      CF-Worker: .*
    action: DENY
  - name: well-known
    path_regex: ^/.well-known/.*$
    action: ALLOW
  - name: favicon
    path_regex: ^/favicon.ico$
    action: ALLOW
  - name: robots-txt
    path_regex: ^/robots.txt$
    action: ALLOW
  - name: static-assets
    path_regex: ^/static/.*$
    action: ALLOW
  - name: assets
    path_regex: ^/assets/.*$
    action: ALLOW
  # SECURITY: Do NOT add user_agent_regex ALLOW rules for crawlers
  # (Googlebot, Bingbot, ...). They are trivially spoofable: any attacker
  # sending "User-Agent: Googlebot" would bypass the PoW challenge entirely.
  # Real crawlers (Googlebot, Bingbot) execute JavaScript and solve the
  # challenge with minimal crawl-budget impact. If SEO issues arise, the
  # recommended alternative is IP-range verification via Anubis
  # `source_cidrs` using the crawler's published IP lists — never a bare
  # user_agent_regex ALLOW.
  #- name: "everyone"
  #  user_agent_regex: "."
  #  action: "CHALLENGE"
  - name: generic-browser
    user_agent_regex: Mozilla
    action: CHALLENGE

store:
  # Use valkey backend (Redis compatible)
  backend: valkey
  parameters:
    # NOTE: This is a template. generate-config.py overwrites this to
    # redis://:{password}@redis:6379/1 (database 1, with auth)
    # Database 0 is reserved for CrowdSec cache.
    url: "redis://redis:6379/0"
