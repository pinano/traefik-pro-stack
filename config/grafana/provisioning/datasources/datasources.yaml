apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    version: 1
    editable: true
    jsonData:
      maxLines: 2000
      timeout: 60

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    version: 2
    editable: true
    # Server-side auth (audit M7): Prometheus requires Basic auth on ALL
    # endpoints, including reads. The token is injected as the container env
    # var of the same name (docker-compose-observability.yaml).
    basicAuth: true
    basicAuthUser: alloy
    secureJsonData:
      basicAuthPassword: ${PROMETHEUS_REMOTE_WRITE_TOKEN}
    jsonData:
      httpMethod: POST
      timeInterval: "15s"
      exemplarTraceIdDestinations: []
