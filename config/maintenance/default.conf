server {
    listen 80;
    server_name _;

    access_log off;
    error_log /var/log/nginx/error.log warn;

    error_page 503 /maintenance_page;

    location / {
        return 503;
    }

    location = /maintenance_page {
        root /etc/nginx/maintenance;
        internal;
        default_type text/html;
        charset utf-8;
        add_header Retry-After "300" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html /index.html.dist =503;
    }
}

# Internal healthcheck listener (loopback only — never exposed on port 80)
server {
    listen 127.0.0.1:8080;
    server_name localhost;

    access_log off;

    location = /healthz {
        return 200 "ok\n";
    }
}
