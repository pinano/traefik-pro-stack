services:

  # ===========================
  #  ANUBIS-ASSETS (Static files server for Anubis challenge pages)
  # ===========================
  anubis-assets:
    image: nginx:1.31.6-alpine3.24-slim
    restart: unless-stopped
    stop_grace_period: 20s
    volumes:
      - ./config/anubis/assets:/usr/share/nginx/html:ro
      - ./config/anubis/nginx-assets.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: '64M'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - traefik
    security_opt:
      - no-new-privileges=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/custom.css"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.services.anubis-assets.loadbalancer.server.port=80"
      # NOTICE: We don't define routers here, we do it via global dynamic config
      # so we don't mess this file up with complex regex

networks:
  traefik:
    name: traefik
    external: true
  anubis-backend:
    name: anubis-backend
    external: true
